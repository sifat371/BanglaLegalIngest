[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bangla-legal-ingest"
version = "0.7.0a1"
description = "BanglaLegalIngest: page-aware ingestion, Bangla encoding handling, legal metadata parsing, and retrieval-ready exports for Bangladesh legal PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Md. Sifat" },
]
keywords = [
  "bangladesh",
  "legal-documents",
  "pdf-ingestion",
  "bangla",
  "bijoy",
  "rag",
  "information-retrieval",
  "document-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
manual = [
  "pdfplumber>=0.10.0",
  "pypdf>=3.17.0",
]
bangla = [
  "bijoy2unicode>=0.1.0",
]
docling = [
  "docling>=2.0.0",
  "tqdm>=4.66.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]
release = [
  "build>=1.2",
  "twine>=5.1",
]
all = [
  "pdfplumber>=0.10.0",
  "pypdf>=3.17.0",
  "bijoy2unicode>=0.1.0",
  "docling>=2.0.0",
  "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/sifat371/BanglaLegalIngest"
Repository = "https://github.com/sifat371/BanglaLegalIngest"
Issues = "https://github.com/sifat371/BanglaLegalIngest/issues"
Documentation = "https://github.com/sifat371/BanglaLegalIngest/tree/main/docs"

[project.scripts]
bangla-legal-ingest = "legal_ingest.cli:main"
legal-ingest = "legal_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
