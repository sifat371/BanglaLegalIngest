name: Feature request
description: Suggest a focused improvement to the ingestion module.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real document/integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example documents or layouts
      description: Link public sources when possible; do not upload confidential material.
  - type: textarea
    id: validation
    attributes:
      label: How should it be validated?
      description: Describe fixtures, expected output, or benchmark criteria.
